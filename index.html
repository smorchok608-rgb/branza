<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мышка и печенька</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 840px; height: 660px;
    transform-origin: 0 0;
  }
  #pet { position: absolute; left: 0; top: 0; width: 840px; height: 660px; pointer-events: none; }
  #cookie {
    position: absolute; width: 92px; height: 100px;
    left: 374px; top: 508px;
    cursor: grab; touch-action: none;
    transform-origin: 50% 50%;
    transition: left .45s cubic-bezier(.3,1.3,.5,1), top .45s cubic-bezier(.3,1.3,.5,1), transform .35s ease, opacity .25s ease;
  }
  #cookie.dragging { cursor: grabbing; transition: transform .15s ease, opacity .25s ease; transform: scale(1.08) rotate(-6deg); }
  #cookie.flying { transition: left .6s cubic-bezier(.5,0,.8,.6), top .6s cubic-bezier(.3,-.4,.7,.6), transform .6s ease-in, opacity .2s ease .5s; pointer-events: none; }
  #cookie.hidden { opacity: 0; pointer-events: none; transition: none; }
  #cookie.pop { transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .2s ease; }
  #cookie img {
    width: 100%; height: 100%; display: block; pointer-events: none;
    filter: drop-shadow(0 6px 5px rgba(60,40,10,.35));
    animation: wob 3.2s ease-in-out infinite;
  }
  #cookie.dragging img, #cookie.flying img { animation: none; }
  @keyframes wob { 0%,100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-3px); } }
  #hint {
    position: absolute; left: 270px; top: 616px; width: 300px; text-align: center;
    font: 600 18px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(70,55,40,.85); text-shadow: 0 0 4px rgba(255,255,255,.9);
    transition: opacity 1s ease; pointer-events: none;
  }
</style>
</head>

<div id="stage">
  <canvas id="pet"></canvas>
  <div id="cookie"><img id="cookieImg" alt="печенька" draggable="false"></div>
  <div id="hint">Покорми Брынзу</div>
</div>

  var EYES = {
    idle: [[235.0, 134.8], [356.8, 136.4]],
    joy:  [[235.8, 132.9], [359.3, 134.0]],
    eat:  [[236.4, 132.4], [364.8, 141.2]]
  };
  var IW = 606, IH = 519;          // размер кадра мышки
  var CX = 420, BOTTOM = 592;      // где мышка стоит на сцене
  var MOUTH = [294, 249];          // рот в координатах кадра

  var imgs = {}, loaded = 0, total = 5;
  Object.keys(SRC).forEach(function (k) {
    var im = new Image();
    im.onload = function () { if (++loaded === total) start(); };
    im.src = SRC[k];
    imgs[k] = im;
  });
  document.getElementById('cookieImg').src = SRC.cookie;

  /* ---------- состояние ---------- */
  var stage = document.getElementById('stage');
  var canvas = document.getElementById('pet');
  var ctx = canvas.getContext('2d');
  var cookie = document.getElementById('cookie');
  var hint = document.getElementById('hint');

  var fat = START_FAT, fatShown = START_FAT;
  var mode = 'idle';               // idle | joy | eat | sleep
  var shown = 'idle', prevShown = null, fadeT = 1;  // какой кадр рисуем и плавный переход
  var want = false;                // печенька поднесена близко — рот открыт
  var idleFor = 0, sleepAfter = 25 + Math.random() * 25, sleepFor = 0, sleepLen = 18;
  var modeT = 0;                   // время в текущем режиме
  var busy = false;
  var t = 0;
  var nextBlink = 2, blinkStart = -10, blinkDur = 0.17, doubleBlink = false;
  var hop = 0;
  var particles = [];
  var crumbTimer = 0;
  var scale = 1;

  try {
    var saved = JSON.parse(localStorage.getItem('mouse_pet') || 'null');
    if (saved && typeof saved.fat === 'number') {
      var away = Math.max(0, (Date.now() - saved.ts) / 1000);
      fat = fatShown = Math.max(0, Math.min(1, saved.fat - away * DECAY_PER_SEC));
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem('mouse_pet', JSON.stringify({ fat: fat, ts: Date.now() })); } catch (e) {}
  }

  /* ---------- размеры ---------- */
  var DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = 840 * DPR; canvas.height = 660 * DPR;
    scale = Math.min(window.innerWidth / 840, window.innerHeight / 660);
    stage.style.transform = 'scale(' + scale + ') translate(-50%, -50%)';
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- геометрия тела ---------- */
  function smooth(a, b, x) { x = Math.max(0, Math.min(1, (x - a) / (b - a))); return x * x * (3 - 2 * x); }
  var cur = { f: 1, sy: 1, breath: 0, chew: 0 };
  function rowScale(y) {
    var w = 0.2 + 0.8 * smooth(0.12, 0.75, y / IH);       // низ тела меняется сильнее головы
    return 1 + (cur.f - 1) * w + 0.009 * cur.breath * w;
  }
  function mapPt(ex, ey) {
    var s = rowScale(ey);
    return { x: CX + (ex - IW / 2) * s, y: BOTTOM - hop - (IH - ey) * cur.sy, s: s };
  }

  function drawHamster(img, a) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    for (var y = 0; y < IH; y += 2) {
      var s = rowScale(y);
      var dw = IW * s;
      ctx.drawImage(img, 0, y, IW, 2, CX - dw / 2, BOTTOM - hop - (IH - y) * cur.sy, dw, 2 * cur.sy + 0.9);
    }
  }

  function drawEyelidsFor(name, p) {
    var eyes = EYES[name];
    for (var i = 0; i < 2; i++) {
      var q = mapPt(eyes[i][0], eyes[i][1]);
      var rx = 20 * q.s, ry = 20 * cur.sy;
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(q.x, q.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      var g = ctx.createLinearGradient(0, q.y - ry, 0, q.y + ry);
      g.addColorStop(0, '#4b4b52'); g.addColorStop(1, '#5d5d63');
      ctx.fillStyle = g;
      ctx.fillRect(q.x - rx - 1, q.y - ry - 1, rx * 2 + 2, ry * 2 * p + 2);
      ctx.restore();
      if (p > 0.8) {
        ctx.strokeStyle = 'rgba(25,25,30,.9)';
        ctx.lineWidth = 2.2; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(q.x - rx * 0.85, q.y - ry * 0.1);
        ctx.quadraticCurveTo(q.x, q.y + ry * 0.55, q.x + rx * 0.85, q.y - ry * 0.1);
        ctx.stroke();
      }
    }
  }

  function drawZzz() {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    for (var i = 0; i < 3; i++) {
      var k = ((t * 0.35) + i / 3) % 1;
      var x = CX + 190 + k * 60 + Math.sin(k * 6 + i) * 8;
      var y = BOTTOM - 420 - k * 110;
      var size = 20 + k * 26;
      ctx.globalAlpha = Math.sin(Math.min(1, k) * Math.PI) * 0.9;
      ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.strokeText(i % 2 ? 'Z' : 'z', x, y);
      ctx.fillStyle = '#6b7fa6';
      ctx.fillText(i % 2 ? 'Z' : 'z', x, y);
    }
    ctx.restore();
  }

  function blinkProgress() {
    var k = (t - blinkStart) / blinkDur;
    if (k < 0 || k > 1) return 0;
    return k < 0.5 ? k * 2 : (1 - k) * 2;
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r, p.r * 0.75, p.rot, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function wake() {
    idleFor = 0;
    sleepAfter = SLEEP_AFTER_MIN + Math.random() * (SLEEP_AFTER_MAX - SLEEP_AFTER_MIN);
    if (mode === 'sleep') { mode = 'idle'; modeT = 0; nextBlink = t + 0.6; }
  }
  function fallAsleep() {
    mode = 'sleep'; modeT = 0;
    sleepLen = SLEEP_MIN + Math.random() * (SLEEP_MAX - SLEEP_MIN);
  }
  window.addEventListener('pointerdown', function () { if (!busy) wake(); });

  /* ---------- кормление ---------- */
  var HOME = { left: 374, top: 508 };
  function mouthOnStage() { var q = mapPt(MOUTH[0], MOUTH[1]); return q; }

  function feed() {
    if (busy) return;
    busy = true;
    wake(); want = false;
    mode = 'joy'; modeT = 0;
    var m = mouthOnStage();
    cookie.classList.remove('dragging', 'pop');
    cookie.classList.add('flying');
    cookie.style.left = (m.x - 46) + 'px';
    cookie.style.top = (m.y - 50) + 'px';
    cookie.style.transform = 'scale(.22) rotate(25deg)';
  }

  function startEating() {
    mode = 'eat'; modeT = 0;
    cookie.classList.add('hidden');
    cookie.classList.remove('flying');
    spawnCrumbs(10);
  }

  function finishEating() {
    mode = 'idle'; modeT = 0;
    save();
    setTimeout(function () {
      cookie.classList.add('hidden');
      cookie.style.left = HOME.left + 'px'; cookie.style.top = HOME.top + 'px';
      cookie.style.transform = 'scale(0)';
      void cookie.offsetWidth;
      cookie.classList.remove('hidden');
      cookie.classList.add('pop');
      cookie.style.transform = 'scale(1)';
      setTimeout(function () { cookie.classList.remove('pop'); cookie.style.transform = ''; busy = false; }, 550);
    }, COOKIE_RESPAWN * 1000);
  }

  function spawnCrumbs(n) {
    var m = mouthOnStage();
    for (var i = 0; i < n; i++) {
      particles.push({
        x: m.x + (Math.random() - 0.5) * 30, y: m.y + 6 + Math.random() * 8,
        vx: (Math.random() - 0.5) * 90, vy: -30 - Math.random() * 60,
        r: 2 + Math.random() * 3, life: 0.7 + Math.random() * 0.6, rot: Math.random() * 3,
        c: ['#d9a95a', '#c58f3f', '#e8c47e', '#b07a30'][(Math.random() * 4) | 0]
      });
    }
  }

  /* ---------- перетаскивание печеньки ---------- */
  var drag = null;
  function toStage(e) {
    var r = stage.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  cookie.addEventListener('pointerdown', function (e) {
    if (busy) return;
    e.preventDefault();
    var p = toStage(e);
    drag = { sx: p.x, sy: p.y, ox: p.x - cookie.offsetLeft, oy: p.y - cookie.offsetTop, moved: 0 };
    cookie.setPointerCapture(e.pointerId);
    cookie.classList.add('dragging');
    cookie.style.transition = '';
  });
  cookie.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var p = toStage(e);
    drag.moved = Math.max(drag.moved, Math.hypot(p.x - drag.sx, p.y - drag.sy));
    cookie.style.left = (p.x - drag.ox) + 'px';
    cookie.style.top = (p.y - drag.oy) + 'px';
    var m = mouthOnStage();
    var near = Math.hypot((p.x - drag.ox + 46) - m.x, (p.y - drag.oy + 50) - m.y) < NEAR_DIST;
    if (near !== want) { want = near; if (near) wake(); }
  });
  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null; want = false;
    cookie.classList.remove('dragging');
    var cx = cookie.offsetLeft + 46, cy = cookie.offsetTop + 50;
    var onMouse = Math.abs(cx - CX) < IW * 0.6 && cy > 90 && cy < BOTTOM;
    if (d.moved < 8 || onMouse) {
      feed();
    } else {
      cookie.style.left = HOME.left + 'px'; cookie.style.top = HOME.top + 'px';
    }
  }
  cookie.addEventListener('pointerup', endDrag);
  cookie.addEventListener('pointercancel', endDrag);

  /* ---------- главный цикл ---------- */
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now; t += dt; modeT += dt;

    // похудение
    if (mode !== 'eat') fat = Math.max(0, fat - DECAY_PER_SEC * dt);
    // толстеет, пока ест
    if (mode === 'eat') fat = Math.min(1, fat + FEED_GAIN * dt / EAT_TIME);
    fatShown += (fat - fatShown) * Math.min(1, dt * 3);

    // сон
    if (mode === 'idle') {
      idleFor += dt;
      if (idleFor > sleepAfter && !busy && !drag) fallAsleep();
    } else if (mode === 'sleep' && modeT > sleepLen) {
      wake();
    }
    // какой кадр показывать
    var target = mode === 'sleep' ? 'sleep' : mode === 'idle' && want ? 'joy' : mode;
    if (target !== shown) { prevShown = shown; shown = target; fadeT = 0; }
    fadeT = Math.min(1, fadeT + dt / 0.28);

    // переходы режимов
    if (mode === 'joy' && modeT > 0.62) startEating();
    if (mode === 'eat' && modeT > EAT_TIME) finishEating();

    // моргание
    if (t > nextBlink) {
      blinkStart = t;
      doubleBlink = Math.random() < 0.18;
      nextBlink = t + 2.2 + Math.random() * 4.2;
      if (doubleBlink) setTimeout(function () { blinkStart = t; }, 260);
    }

    // параметры тела
    cur.f = 0.86 + fatShown * 0.46;
    cur.breath = mode === 'sleep' ? Math.sin(t * 1.15) * 1.5 : Math.sin(t * 1.95);
    var chew = 0;
    if (mode === 'eat') chew = Math.sin(modeT * 15) * 0.012;
    cur.sy = (0.93 + 0.09 * fatShown) * (1 + 0.012 * cur.breath + chew);
    hop = mode === 'joy' ? Math.abs(Math.sin(modeT * 9)) * 14 * Math.min(1, (0.62 - modeT) * 4 + 0.3) : 0;

    // крошки
    if (mode === 'eat') {
      crumbTimer -= dt;
      if (crumbTimer <= 0) { spawnCrumbs(2); crumbTimer = 0.14; }
    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt; p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 4;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // рисуем
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, 840, 660);
    if (fadeT < 1 && prevShown) {
      drawHamster(imgs[prevShown], 1);
      ctx.globalAlpha = fadeT;
      drawHamster(imgs[shown], fadeT);
      ctx.globalAlpha = 1;
    } else {
      drawHamster(imgs[shown], 1);
    }
    // веки: только когда глаза открыты на кадре
    if (shown === mode || shown === 'joy') {
      if (shown !== 'sleep' && mode !== 'sleep') drawEyelidsFor(shown, blinkProgress());
    }
    drawParticles();
    if (mode === 'sleep') drawZzz();

    requestAnimationFrame(frame);
  }

  function start() {
    cookie.style.left = HOME.left + 'px';
    cookie.style.top = HOME.top + 'px';
    window.addEventListener('beforeunload', save);
    setInterval(save, 5000);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
